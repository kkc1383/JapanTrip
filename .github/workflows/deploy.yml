name: CI

on:
  push:
    branches: [main]

jobs:
  ci:
    name: 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS 문법 검사
        run: |
          for f in js/*.js; do node --check "$f"; done
